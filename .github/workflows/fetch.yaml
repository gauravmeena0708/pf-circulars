name: Fetch EPF India circulars

# Weekly: add newly listed circulars to circular-data.json, and add them to the search
# index once enough are waiting. Each index update stores about 290 MB in Git LFS, so
# small numbers are batched; set the repository variable INDEX_MIN_PENDING to change
# the threshold, or run the workflow by hand with "index_now".

on:
  workflow_dispatch:
    inputs:
      index_now:
        description: Index waiting circulars even if fewer than the usual minimum
        type: boolean
        default: false
      probe:
        description: Only test that the listing and a PDF can be read; change nothing
        type: boolean
        default: false
  schedule:
   - cron: '0 4 * * 1' # Every Monday at 4 AM UTC

concurrency:
  group: circular-update
  cancel-in-progress: false

env:
  INDEX_MIN_PENDING: ${{ vars.INDEX_MIN_PENDING || '5' }}
  PROBE_PDF: https://pmvbry-cdn.epfindia.gov.in/wp-content/uploads/2025/09/161.pdf

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The index files stay as Git LFS pointers until they are needed.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install listing dependencies
        run: pip install requests beautifulsoup4

      - name: Add newly listed circulars
        run: python ./fetch.py ${{ inputs.probe && '--dry-run' || '' }}

      - name: Commit the circular list if it changed
        id: listing
        if: ${{ !inputs.probe }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add circular-data.json
          if git diff --staged --quiet; then
            echo "No new circulars listed."
          else
            git commit -m "Update EPF circulars data"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Count circulars waiting to be indexed
        id: queue
        run: python scripts/index_new_circulars.py --list

      - name: Decide whether to index
        id: plan
        run: |
          pending=${{ steps.queue.outputs.pending }}
          if [ "${{ inputs.probe }}" = "true" ]; then
            echo "mode=probe" >> "$GITHUB_OUTPUT"
          elif [ "$pending" -ge "$INDEX_MIN_PENDING" ] || { [ "${{ inputs.index_now }}" = "true" ] && [ "$pending" -gt 0 ]; }; then
            echo "mode=index" >> "$GITHUB_OUTPUT"
          else
            echo "$pending waiting; indexing starts at $INDEX_MIN_PENDING."
          fi

      - name: Install reading and indexing dependencies
        if: steps.plan.outputs.mode
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers==5.2.0 faiss-cpu==1.13.2 rank-bm25==0.2.2 numpy==2.4.0 \
            "python-dotenv>=1.0,<2" PyMuPDF==1.26.7 Pillow==12.0.0 pytesseract==0.3.13 langchain-text-splitters

      - name: Probe one PDF
        if: steps.plan.outputs.mode == 'probe'
        run: python scripts/index_new_circulars.py --probe-url "$PROBE_PDF"

      - name: Read and index waiting circulars
        id: index
        if: steps.plan.outputs.mode == 'index'
        run: |
          git lfs pull
          python scripts/index_new_circulars.py

      - name: Commit the index and pin it for the Space
        id: publish
        if: steps.plan.outputs.mode == 'index'
        run: |
          git add ocr_updates vector_store/data_index/faiss_index.index \
            vector_store/data_index/faiss_index.passages.db vector_store/data_index/faiss_index.bm25.json.gz
          if git diff --staged --quiet; then
            echo "Nothing was indexed."
            exit 0
          fi
          git commit -m "Index newly listed circulars"
          git pull --rebase
          git push
          # The Space downloads the index at the commit named in the manifest, so the
          # manifest is recorded only after that commit is on GitHub.
          python scripts/fetch_runtime_assets.py --record-commit "$(git rev-parse HEAD)"
          git add deploy/runtime-assets.json
          git commit -m "Pin runtime assets to the updated index"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made by this job does not start sync_to_hf.yaml, so changes are sent here.
      # The index is excluded, as in sync_to_hf.yaml: the Space gets it from deploy/runtime-assets.json.
      - name: Sync to Hugging Face Space
        if: steps.listing.outputs.changed == 'true' || steps.publish.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub==0.36.0
          python -c "from huggingface_hub import HfApi; HfApi().upload_folder(folder_path='.', repo_id='gauravmeena0708/epfo-circulars', repo_type='space', ignore_patterns=['.git/*', '.github/*', 'vector_store/*', 'policy_data/*/pdfs/*'])"
