name: Fetch EPF India circulars

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
   - cron: '0 4 * * 1' # Every Monday at 4 AM UTC

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The index files stay as Git LFS pointers here; this job only updates the circular list.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Add newly listed circulars
        run: python ./fetch.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull
          git add circular-data.json
          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "updated=false" >> $GITHUB_ENV
          else
            git commit -m "Update EPF circulars data"
            git push
            echo "updated=true" >> $GITHUB_ENV
          fi

      # A push made by this job does not start sync_to_hf.yaml, so the changed list is sent here.
      # The index is excluded, as in sync_to_hf.yaml: the Space gets it from deploy/runtime-assets.json.
      - name: Sync to Hugging Face Space
        if: env.updated == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub==0.36.0
          python -c "from huggingface_hub import HfApi; HfApi().upload_folder(folder_path='.', repo_id='gauravmeena0708/epfo-circulars', repo_type='space', ignore_patterns=['.git/*', '.github/*', 'vector_store/*', 'policy_data/*/pdfs/*'])"
